name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test tuner
        run: ./gradlew :tuner:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk car-radio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: car-radio-apk
          path: car-radio.apk

      # Keeps one always-current download link for the head unit's browser.
      - name: Publish test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --cleanup-tag --yes || true
          gh release create teste car-radio.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Versão de teste" \
            --notes "APK de teste gerado a partir de ${GITHUB_SHA::7}."

      # Same for a pull request from this repository, so it can be tried on the head unit
      # before merging.
      - name: Publish pull request test release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: teste-pr-${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" car-radio.apk \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Versão de teste do PR #$PR_NUMBER" \
            --notes "APK de teste do PR #$PR_NUMBER, gerado a partir de ${HEAD_SHA::7}."

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete pull request test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "teste-pr-${{ github.event.number }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
