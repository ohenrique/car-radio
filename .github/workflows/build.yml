name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test tuner
        run: ./gradlew :tuner:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk car-radio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: car-radio-apk
          path: car-radio.apk

      # Keeps one always-current download link for the head unit's browser.
      - name: Publish test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --cleanup-tag --yes || true
          gh release create teste car-radio.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Versão de teste" \
            --notes "APK de teste gerado a partir de ${GITHUB_SHA::7}."
